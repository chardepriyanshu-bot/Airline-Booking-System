spring.application.name=notification-service

server.port=8097

#Eureka server
eureka.client.service-url.defaultZone=http://localhost:8096/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties[spring.json.trusted.packages]=com.pc.event
spring.kafka.consumer.properties[spring.json.value.default.type]=com.pc.event.PaymentSuccessEvent
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO