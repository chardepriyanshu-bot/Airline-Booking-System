spring.application.name=seat-inventory-service

server.port=8092

spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=smith
spring.datasource.password=hello

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

#Feign client url
services.schedule.url=http://localhost:8090
services.flight.url=http://localhost:8089
services.aircraft.url=http://localhost:8088

#Eureka server
eureka.client.service-url.defaultZone=http://localhost:8096/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#jwt secret key
jwt.secret=${JWT_SECRET}

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379