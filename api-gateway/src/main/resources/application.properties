spring.application.name=api-gateway
server.port=8094

# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/user/**

# Auth Service
spring.cloud.gateway.server.webmvc.routes[1].id=auth-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/auth/**

# Airline Service
spring.cloud.gateway.server.webmvc.routes[2].id=airline-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://AIRELINE-CORE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/airline/**

# Aircraft Service
spring.cloud.gateway.server.webmvc.routes[3].id=aircraft-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://AIRELINE-CORE-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/aircraft/**

# Flight Service
spring.cloud.gateway.server.webmvc.routes[4].id=flight-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://FLIGHT-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/flight/**

# Flight Schedule Service
spring.cloud.gateway.server.webmvc.routes[5].id=flight-schedule-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://FLIGHT-SCHEDULE-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/flight-schedules/**

# Booking Service
spring.cloud.gateway.server.webmvc.routes[6].id=booking-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/bookings/**

# Seat Inventory Service
spring.cloud.gateway.server.webmvc.routes[7].id=seat-inventory-service
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://SEAT-INVENTORY-SERVICE
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/seat-inventory/**

# Payment Service
spring.cloud.gateway.server.webmvc.routes[8].id=payment-service
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/payments/**

# City Service
spring.cloud.gateway.server.webmvc.routes[9].id=city-service
spring.cloud.gateway.server.webmvc.routes[9].uri=lb://AIRLINE-SERVICE
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/cities/**

# Airport Service
spring.cloud.gateway.server.webmvc.routes[10].id=airport-service
spring.cloud.gateway.server.webmvc.routes[10].uri=lb://AIRLINE-SERVICE
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/api/airports/**

#Notification Service
spring.cloud.gateway.server.webmvc.routes[11].id=notification-service
spring.cloud.gateway.server.webmvc.routes[11].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[11].predicates[0]=Path=/api/notifications/**

# JWT
jwt.secret=${JWT_SECRET}

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8096/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true